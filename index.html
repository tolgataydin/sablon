<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">

<title>Yerleşim Şablonu</title>
<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}
#uygulama{display:flex;flex-direction:column;flex:1;min-height:0}
#kilit{margin:auto;padding:24px;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
#kilit input{font:inherit;min-height:44px;padding:0 12px;border:1px solid var(--cizgi);border-radius:8px;background:var(--kagit);color:var(--murekkep)}
#kilitNot{color:var(--uyari);min-height:1.2em;margin:0;font-size:13px}</style>

<style>
/* Yerleşim: tek ekran. Üstte ince durum şeridi, ortada harita, altta parça ekleme şeridi; seçili parça için harita üstünde kayan panel. */
:root{
  --zemin:#eef1ea; --kagit:#f8faf5; --murekkep:#1c2922; --soluk:#5d6b62; --cizgi:#c9d2c6;
  --vurgu:#2b55c9; --vurgu-acik:#dfe7fb; --uyari:#b3261e; --uyari-acik:#f7dcd9;
  --teras-a:#dfe8cf; --teras-b:#d2dfc4; --sev:#e7dcc3; --agac:#4f8a45; --agac-kes:#c8372d;
  --bina:#e9d2ac; --bina-cizgi:#5a4226; --havuz:#62b2de; --ana:#b98558; --yardimci:#cfcabd; --yol:#9c968a; --orman:#356b4f; --ben:#1a73e8;
  --yazi: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sayi: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --zemin:#141a16; --kagit:#1b231e; --murekkep:#e6ece5; --soluk:#9aa89e; --cizgi:#334038;
  --vurgu:#8fb0ff; --vurgu-acik:#22305a; --uyari:#ff8a80; --uyari-acik:#4a211e;
  --teras-a:#26331f; --teras-b:#2d3b25; --sev:#3a3324; --agac:#6fae62; --agac-kes:#ff6b5e;
  --bina:#8a7350; --bina-cizgi:#f0dfc2; --havuz:#3f8fbd; --ana:#a06a3f; --yardimci:#5b584f; --yol:#7b766c; --orman:#5fa57f;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --zemin:#141a16; --kagit:#1b231e; --murekkep:#e6ece5; --soluk:#9aa89e; --cizgi:#334038;
  --vurgu:#8fb0ff; --vurgu-acik:#22305a; --uyari:#ff8a80; --uyari-acik:#4a211e;
  --teras-a:#26331f; --teras-b:#2d3b25; --sev:#3a3324; --agac:#6fae62; --agac-kes:#ff6b5e;
  --bina:#8a7350; --bina-cizgi:#f0dfc2; --havuz:#3f8fbd; --ana:#a06a3f; --yardimci:#5b584f; --yol:#7b766c; --orman:#5fa57f;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--zemin);color:var(--murekkep);font-family:var(--yazi);font-size:15px;display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:var(--kagit);border:1px solid var(--cizgi);border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px}
button:active{background:var(--vurgu-acik)}
.ust{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--kagit);border-bottom:1px solid var(--cizgi)}
.ust h1{font-size:16px;font-weight:650;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.durum{font-size:12px;color:var(--soluk);white-space:nowrap}
.durum.sorun{color:var(--uyari)}
.harita{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ozet{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;background:var(--kagit);border:1px solid var(--cizgi);border-radius:8px;padding:6px 10px;
  font-size:12px;line-height:1.5;color:var(--soluk);pointer-events:none}
.ozet b{color:var(--murekkep);font-family:var(--sayi);font-weight:600}
.konum{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:52px;min-height:40px;font-size:13px;font-weight:600;color:var(--vurgu);border-color:var(--vurgu)}
.ipucu{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(300px,80%);text-align:center;background:var(--kagit);border:1px solid var(--cizgi);
  border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.45;pointer-events:none}
.secim{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;background:var(--kagit);
  border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 20px rgb(0 0 0 / .18)}
.secim-bas{display:flex;align-items:baseline;gap:8px}
.secim-bas strong{font-size:16px}
.secim-bas span{font-size:12px;color:var(--soluk);font-family:var(--sayi)}
.bilgi{font-size:13px;line-height:1.45;color:var(--soluk);margin:0}
.bilgi .kotu{color:var(--uyari);font-weight:600}
.sira{display:flex;gap:8px;flex-wrap:wrap}
.sira button{flex:1 1 60px;padding:0 8px}
.sil{color:var(--uyari);border-color:var(--uyari)}
.alt{background:var(--kagit);border-top:1px solid var(--cizgi);padding-block:8px}
.ekle{display:flex;gap:8px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.ekle button{flex:0 0 auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ekle i{display:inline-block;width:18px;height:12px;border:1.5px solid var(--bina-cizgi);border-radius:2px;background:var(--bina)}
.ekle i.havuz{background:var(--havuz)} .ekle i.ana{background:var(--ana)} .ekle i.yrd{background:var(--yardimci)}
.perde{position:absolute;inset:0;background:rgb(0 0 0 / .35);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.kagit{background:var(--kagit);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:10px;max-height:85%;overflow-y:auto}
.kagit h2{margin:0;font-size:17px}
.kagit p{margin:0;font-size:14px;line-height:1.5;color:var(--soluk)}
.kagit textarea{width:100%;box-sizing:border-box;height:140px;font:12px/1.4 var(--sayi);background:var(--zemin);color:var(--murekkep);border:1px solid var(--cizgi);border-radius:8px;padding:8px;
  -webkit-user-select:text;user-select:text}
.ana-dugme{background:var(--vurgu);color:var(--kagit);border-color:var(--vurgu);font-weight:600}
</style>
</head><body>
<div id="kilit" hidden><h1 style="font-size:18px;margin:0">Bu sayfa kilitli</h1>
<p style="margin:0;color:var(--soluk)">Sana verilen bağlantının tamamını ya da anahtarı buraya yapıştır.</p>
<input id="kilitGiris" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Bağlantı ya da anahtar">
<button id="kilitAc" class="ana-dugme">Aç</button><p id="kilitNot"></p></div>
<div id="uygulama" hidden>

<div class="ust">
  <h1>Bahçe yerleşim şablonu</h1>
  <span class="durum" id="durum">Yükleniyor…</span>
  <button id="menuDugme" aria-label="Menü">Menü</button>
</div>

<div class="harita" id="harita">
  <canvas id="tuval"></canvas>
  <div class="ozet" id="ozet"></div>
  <button class="konum" id="konumDugme" hidden>Konumu aç</button>
  <div class="ipucu" id="ipucu">Harita boş. Alttaki düğmelerden bina ekle, üstüne dokunup seç, parmağınla sürükle. İki parmakla yakınlaşır ve döner.</div>

  <div class="secim" id="secim" hidden>
    <div class="secim-bas"><strong id="secAd"></strong><span id="secOlcu"></span></div>
    <p class="bilgi" id="secBilgi"></p>
    <div class="sira">
      <button id="donSol5" aria-label="5 derece sola döndür">⟲ 5°</button>
      <button id="donSol1" aria-label="1 derece sola döndür">⟲ 1°</button>
      <button id="donSag1" aria-label="1 derece sağa döndür">1° ⟳</button>
      <button id="donSag5" aria-label="5 derece sağa döndür">5° ⟳</button>
    </div>
    <div class="sira">
      <button id="buraya" hidden>Konumuma taşı</button>
      <button id="kopya">Kopyasını ekle</button>
      <button id="sil" class="sil">Sil</button>
      <button id="birak" class="ana-dugme">Tamam</button>
    </div>
  </div>

  <div class="perde" id="perde" hidden><div class="kagit" id="kagit"></div></div>
</div>

<div class="alt">
  <div class="ekle" id="ekle">
    <button data-tip="ev"><i></i>Ev 11×7</button>
    <button data-tip="havuz"><i class="havuz"></i>Havuz 7×3,5</button>
    <button data-tip="ana"><i class="ana"></i>Ana bina 16×9</button>
    <button data-tip="park"><i class="yrd"></i>Ev parkı 5×5</button>
    <button data-tip="otopark"><i class="yrd"></i>Otopark 16×5</button>
    <button data-tip="resepsiyon"><i class="yrd"></i>Resepsiyon 8×6</button>
    <button data-tip="aritma"><i class="yrd"></i>Arıtma 10×6</button>
  </div>
</div>

</div>
<script>
let SAHA = null, GEO = null;
function BASLAT(){

const TIP = {
  ev:{ad:"Ev", en:11, der:7, renk:"--bina", on:true},
  havuz:{ad:"Havuz", en:7, der:3.5, renk:"--havuz"},
  ana:{ad:"Ana bina", en:16, der:9, renk:"--ana", on:true},
  park:{ad:"Park", en:5, der:5, renk:"--yardimci"},
  otopark:{ad:"Otopark", en:16, der:5, renk:"--yardimci"},
  resepsiyon:{ad:"Resepsiyon", en:8, der:6, renk:"--yardimci"},
  aritma:{ad:"Arıtma", en:10, der:6, renk:"--yardimci"},
};
const KESIM_PAYI = 2.0;      // bina kenarına bu kadar yakın ceviz kesilir (m)
const el = id => document.getElementById(id);
const tuval = el("tuval"), c = tuval.getContext("2d");

let durum = {parcalar:[], sayac:{}, guncelleme:""};
let secili = null, agacNo = false, oturumdaDegisti = false;
let gor = {s:3, ox:0, oy:0, rot:0};    // ekran = merkez + döndür(rot) * ölçek; rot radyan, saat yönünün tersine

/* ---------- geometri ---------- */
function koseler(p, pay){
  const t = TIP[p.tip], a = p.aci*Math.PI/180, co = Math.cos(a), si = Math.sin(a), w = t.en/2 + (pay||0), d = t.der/2 + (pay||0);
  return [[-w,-d],[w,-d],[w,d],[-w,d]].map(([x,y]) => [p.x + x*co - y*si, p.y + x*si + y*co]);
}
function icinde(pt, poli){
  let ic = false;
  for(let i=0, j=poli.length-1; i<poli.length; j=i++){
    const a = poli[i], b = poli[j];
    if((a[1] > pt[1]) !== (b[1] > pt[1]) && pt[0] < (b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1]) + a[0]) ic = !ic;
  }
  return ic;
}
function noktaParca(pt, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1], l = dx*dx + dy*dy;
  let t = l ? ((pt[0]-a[0])*dx + (pt[1]-a[1])*dy)/l : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(pt[0]-a[0]-t*dx, pt[1]-a[1]-t*dy);
}
function poliUzaklik(A, B){
  if(A.some(p => icinde(p, B)) || B.some(p => icinde(p, A))) return 0;
  let m = Infinity;
  for(let i=0;i<A.length;i++) for(let j=0;j<B.length;j++){
    m = Math.min(m, noktaParca(A[i], B[j], B[(j+1)%B.length]), noktaParca(B[j], A[i], A[(i+1)%A.length]));
  }
  return m;
}
function kesilenler(p){
  const K = koseler(p, KESIM_PAYI);
  return SAHA.agac.filter(a => icinde([a[1], a[2]], K)).map(a => a[0]);
}
function terasBul(p){
  for(const t of SAHA.teras) if(icinde([p.x, p.y], t.pts)) return t;
  return null;
}

/* ---------- çizim ---------- */
function renk(ad){ return getComputedStyle(document.documentElement).getPropertyValue(ad).trim(); }
function E(x, y){ const co = Math.cos(gor.rot), si = Math.sin(gor.rot); return [gor.ox + (x*co - y*si)*gor.s, gor.oy - (x*si + y*co)*gor.s]; }
function yol(pts, kapat){
  c.beginPath();
  pts.forEach((p, i) => { const [x, y] = E(p[0], p[1]); i ? c.lineTo(x, y) : c.moveTo(x, y); });
  if(kapat) c.closePath();
}
function boyutla(){
  const r = tuval.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  tuval.width = Math.round(r.width*dpr); tuval.height = Math.round(r.height*dpr);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return r;
}
function sigdir(){
  const r = tuval.getBoundingClientRect();
  const co = Math.cos(gor.rot), si = Math.sin(gor.rot);
  const xs = SAHA.sinir.map(p => p[0]*co - p[1]*si), ys = SAHA.sinir.map(p => p[0]*si + p[1]*co);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  gor.s = Math.min((r.width-24)/(x1-x0), (r.height-24)/(y1-y0));
  gor.ox = r.width/2 - (x0+x1)/2*gor.s; gor.oy = r.height/2 + (y0+y1)/2*gor.s;
}
function ciz(){
  const r = tuval.getBoundingClientRect();
  c.clearRect(0, 0, r.width, r.height);
  const R = {};
  ["--zemin","--kagit","--murekkep","--soluk","--cizgi","--vurgu","--uyari","--teras-a","--teras-b","--sev","--agac","--agac-kes","--bina-cizgi","--yol","--orman"].forEach(k => R[k] = renk(k));
  // arazi (şev rengi) + teraslar
  yol(SAHA.sinir, true); c.fillStyle = R["--sev"]; c.fill();
  SAHA.teras.forEach((t, i) => { yol(t.pts, true); c.fillStyle = R[i%2 ? "--teras-b" : "--teras-a"]; c.fill(); });
  // orman çekme şeridi
  c.save(); c.globalAlpha = .28; c.fillStyle = R["--orman"];
  SAHA.cekme.forEach(p => { yol(p, true); c.fill(); }); c.restore();
  SAHA.orman.forEach(l => { yol(l); c.strokeStyle = R["--orman"]; c.lineWidth = 2; c.stroke(); });
  // yollar
  c.lineCap = "round"; c.lineJoin = "round";
  SAHA.hamyol.forEach(l => { yol(l); c.strokeStyle = R["--yol"]; c.lineWidth = Math.max(1.5, 3*gor.s); c.setLineDash([6, 6]); c.stroke(); c.setLineDash([]); });
  SAHA.myol.forEach(l => { yol(l); c.strokeStyle = R["--yol"]; c.lineWidth = Math.max(2, 3.5*gor.s); c.stroke(); });
  yol(SAHA.sinir, true); c.strokeStyle = R["--murekkep"]; c.lineWidth = 1.5; c.stroke();
  // mevcut ev
  yol(SAHA.mev, true); c.fillStyle = R["--uyari"]; c.globalAlpha = .55; c.fill(); c.globalAlpha = 1; c.strokeStyle = R["--murekkep"]; c.lineWidth = 1; c.stroke();
  // ağaçlar
  const kes = new Set(); durum.parcalar.forEach(p => { if(p.tip !== "park" || true) kesilenler(p).forEach(k => kes.add(k)); });
  const rr = Math.max(1.6, 2.2*gor.s);
  SAHA.agac.forEach(a => {
    const [x, y] = E(a[1], a[2]); const k = kes.has(a[0]);
    c.beginPath(); c.arc(x, y, rr, 0, 6.2832); c.fillStyle = R[k ? "--agac-kes" : "--agac"]; c.globalAlpha = k ? .95 : .7; c.fill(); c.globalAlpha = 1;
    if(agacNo && gor.s > 5){ c.fillStyle = R["--murekkep"]; c.font = "10px " + renk("--sayi"); c.textAlign = "center"; c.fillText(a[0], x, y + 3); }
  });
  // teras adları
  if(gor.s > 1.6){
    c.font = "600 12px " + renk("--yazi"); c.textAlign = "center"; c.fillStyle = R["--soluk"];
    SAHA.teras.forEach(t => {
      const cx = t.pts.reduce((s, p) => s + p[0], 0)/t.pts.length, cy = t.pts.reduce((s, p) => s + p[1], 0)/t.pts.length;
      const [x, y] = E(cx, cy); c.fillText(t.ad + " · " + String(t.kot).replace(".", ",") + " m", x, y);
    });
    const m = SAHA.mev.reduce((s, p) => [s[0]+p[0]/SAHA.mev.length, s[1]+p[1]/SAHA.mev.length], [0, 0]);
    const [mx, my] = E(m[0], m[1]); c.fillStyle = R["--murekkep"]; c.fillText("mevcut ev", mx, my + 4);
  }
  // parçalar
  durum.parcalar.forEach(p => {
    const t = TIP[p.tip], K = koseler(p), sec = p.id === secili;
    yol(K, true); c.fillStyle = renk(t.renk); c.globalAlpha = .92; c.fill(); c.globalAlpha = 1;
    c.strokeStyle = sec ? R["--vurgu"] : R["--bina-cizgi"]; c.lineWidth = sec ? 3 : 1.5; c.stroke();
    if(t.on){   // ön cephe (manzara tarafı): kalın çizgi + küçük ok
      const a = E(K[0][0], K[0][1]), b = E(K[1][0], K[1][1]);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.strokeStyle = sec ? R["--vurgu"] : R["--bina-cizgi"]; c.lineWidth = sec ? 5 : 4; c.stroke();
      const an = p.aci*Math.PI/180, ux = Math.sin(an), uy = -Math.cos(an);
      const o = E(p.x + ux*(t.der/2), p.y + uy*(t.der/2)), u = E(p.x + ux*(t.der/2 + 3), p.y + uy*(t.der/2 + 3));
      c.beginPath(); c.moveTo(o[0], o[1]); c.lineTo(u[0], u[1]); c.lineWidth = 2; c.stroke();
    }
    if(gor.s > 2.2){
      const [x, y] = E(p.x, p.y); c.fillStyle = R["--murekkep"]; c.font = "600 " + Math.min(14, Math.max(10, 2.2*gor.s)) + "px " + renk("--yazi"); c.textAlign = "center";
      c.fillText(p.ad, x, y + 4);
    }
  });
  if(konum){
    const [kx0, ky0] = E(konum.x, konum.y), ben = renk("--ben");
    c.beginPath(); c.arc(kx0, ky0, Math.max(8, konum.d*gor.s), 0, 6.2832); c.fillStyle = ben; c.globalAlpha = .16; c.fill(); c.globalAlpha = 1;
    c.beginPath(); c.arc(kx0, ky0, 7, 0, 6.2832); c.fillStyle = R["--kagit"]; c.fill();
    c.beginPath(); c.arc(kx0, ky0, 5, 0, 6.2832); c.fillStyle = ben; c.fill();
  }
  // ölçek + kuzey
  const adaylar = [5, 10, 20, 50, 100]; const uz = adaylar.find(v => v*gor.s > 70) || 100;
  const bx = r.width - 16 - uz*gor.s, by = r.height - (el("secim").hidden ? 18 : 18);
  if(el("secim").hidden){
    c.strokeStyle = R["--murekkep"]; c.lineWidth = 2; c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + uz*gor.s, by); c.moveTo(bx, by-4); c.lineTo(bx, by+4);
    c.moveTo(bx + uz*gor.s, by-4); c.lineTo(bx + uz*gor.s, by+4); c.stroke();
    c.fillStyle = R["--murekkep"]; c.font = "11px " + renk("--sayi"); c.textAlign = "right"; c.fillText(uz + " m", bx + uz*gor.s, by - 8);
  }
  const nx = r.width - 30, ny = 34, kco = Math.cos(gor.rot), ksi = Math.sin(gor.rot), kx = SAHA.kuzey[0]*kco - SAHA.kuzey[1]*ksi, ky = -(SAHA.kuzey[0]*ksi + SAHA.kuzey[1]*kco);
  c.strokeStyle = R["--murekkep"]; c.fillStyle = R["--murekkep"]; c.lineWidth = 2;
  c.beginPath(); c.moveTo(nx - kx*14, ny - ky*14); c.lineTo(nx + kx*14, ny + ky*14); c.stroke();
  c.beginPath(); c.moveTo(nx + kx*18, ny + ky*18); c.lineTo(nx + kx*8 - ky*5, ny + ky*8 + kx*5); c.lineTo(nx + kx*8 + ky*5, ny + ky*8 - kx*5); c.closePath(); c.fill();
  c.font = "600 11px " + renk("--yazi"); c.textAlign = "center"; c.fillText("K", nx + kx*27, ny + ky*27 + 4);
  ozetYaz(kes.size);
}
function ozetYaz(kesSay){
  const say = t => durum.parcalar.filter(p => p.tip === t).length;
  el("ozet").innerHTML = "Ev <b>" + say("ev") + "</b> · Havuz <b>" + say("havuz") + "</b> · Kesilecek ceviz <b>" + kesSay + "</b>";
  el("ipucu").hidden = durum.parcalar.length > 0;
}

/* ---------- seçim paneli ---------- */
function seciliParca(){ return durum.parcalar.find(p => p.id === secili) || null; }
function paneliYaz(){
  const p = seciliParca(); el("secim").hidden = !p; el("buraya").hidden = !konum;
  if(!p){ ciz(); return; }
  const t = TIP[p.tip];
  el("secAd").textContent = p.ad;
  el("secOlcu").textContent = String(t.en).replace(".", ",") + " × " + String(t.der).replace(".", ",") + " m · " + Math.round(((p.aci % 360) + 360) % 360) + "°";
  const sat = [], ter = terasBul(p);
  // köşelerin hepsi aynı terasta mı
  const K = koseler(p), hepsi = ter && K.every(k => icinde(k, ter.pts));
  if(ter && hepsi) sat.push("Teras " + ter.ad + " (" + String(ter.kot).replace(".", ",") + " m)");
  else if(ter) sat.push('<span class="kotu">Teras ' + ter.ad + " kenarından şeve taşıyor</span>");
  else sat.push('<span class="kotu">Teras dışında (şev ya da yol)</span>');
  if(!K.every(k => icinde(k, SAHA.sinir))) sat.push('<span class="kotu">Arazi sınırının dışına taşıyor</span>');
  if(p.tip !== "park" && p.tip !== "otopark" && SAHA.cekme.some(g => K.some(k => icinde(k, g)))) sat.push('<span class="kotu">Orman çekme şeridinde (10 m)</span>');
  const ks = kesilenler(p); sat.push(ks.length ? '<span class="kotu">' + ks.length + " ceviz kesilir</span> (no " + ks.join(", ") + ")" : "Ceviz kesilmiyor");
  if(p.tip === "ev" || p.tip === "ana"){
    let en = Infinity, kim = "";
    durum.parcalar.forEach(q => { if(q.id !== p.id && (q.tip === "ev" || q.tip === "ana")){ const d = poliUzaklik(K, koseler(q)); if(d < en){ en = d; kim = q.ad; } } });
    const dm = poliUzaklik(K, SAHA.mev); if(dm < en){ en = dm; kim = "mevcut ev"; }
    if(isFinite(en)) sat.push((en < 6.5 ? '<span class="kotu">' : "<span>") + "En yakın bina: " + kim + ", " + en.toFixed(1).replace(".", ",") + " m</span>");
  }
  el("secBilgi").innerHTML = sat.join(" · ");
  ciz();
}

/* ---------- durum değişiklikleri ---------- */
function yeniId(){ return "p" + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
function ekle(tip, x, y, aci, ad){
  durum.sayac[tip] = (durum.sayac[tip] || 0) + 1;
  const p = {id:yeniId(), tip, ad: ad || (TIP[tip].ad + " " + durum.sayac[tip]), x:+x.toFixed(2), y:+y.toFixed(2), aci: aci || 0};
  durum.parcalar.push(p); secili = p.id; degisti(); paneliYaz();
}
function degisti(){
  oturumdaDegisti = true; durum.guncelleme = new Date().toISOString();
  try{ localStorage.setItem("bahce-sablon", JSON.stringify(durum)); }catch(e){}
  kaydetPlanla();
}

/* ---------- kayıt: db (Claude okuyabilir) + telefon yedeği ---------- */
let db = null, ref = null, kaydediyor = false, kirli = false, zamanlayici = null;
function durumYaz(m, sorun){ const d = el("durum"); d.textContent = m; d.classList.toggle("sorun", !!sorun); }
function kaydetPlanla(){
  if(!ref){ durumYaz("Yalnız bu telefonda kayıtlı", false); return; }
  kirli = true; durumYaz("Kaydediliyor…"); clearTimeout(zamanlayici); zamanlayici = setTimeout(kaydet, 1200);
}
async function kaydet(){
  if(!ref || kaydediyor || !kirli) return;
  kaydediyor = true; kirli = false;
  try{
    await ref.set(JSON.parse(JSON.stringify(durum)));
    if(!kirli) durumYaz("Kaydedildi");
  }catch(e){
    kirli = true;
    durumYaz(e && e.code === "invalid_argument" ? "Kaydedilemedi (yazma izni yok)" : "Bağlantı yok, telefonda duruyor", true);
    if(!(e && e.code === "invalid_argument")){ clearTimeout(zamanlayici); zamanlayici = setTimeout(kaydet, 15000); }
  }
  kaydediyor = false;
  if(kirli && !zamanlayici) zamanlayici = setTimeout(kaydet, 1200);
}
function gecerli(d){ return d && Array.isArray(d.parcalar) && d.parcalar.every(p => TIP[p.tip] && isFinite(p.x) && isFinite(p.y)); }
async function yukle(){
  try{ const y = JSON.parse(localStorage.getItem("bahce-sablon") || "null"); if(gecerli(y)){ durum = y; durum.sayac = durum.sayac || {}; } }catch(e){}
  paneliYaz();
  try{
    db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if(!db){ durumYaz("Yalnız bu telefonda kayıtlı"); return; }
    ref = db.doc("plan/guncel");
    const snap = await Promise.race([ref.get(), new Promise((_, r) => setTimeout(() => r({code:"zaman"}), 10000))]);
    const uz = snap.exists ? snap.data() : null;
    if(gecerli(uz) && !oturumdaDegisti && String(uz.guncelleme || "") >= String(durum.guncelleme || "")){
      durum = JSON.parse(JSON.stringify(uz)); durum.sayac = durum.sayac || {};
      if(!seciliParca()) secili = null;
      paneliYaz(); durumYaz("Kaydedildi");
    }else if(durum.parcalar.length || oturumdaDegisti){ kirli = true; kaydet(); }
    else durumYaz("Hazır");
  }catch(e){ durumYaz("Bağlantı yok, telefonda duruyor", true); if(ref){ kirli = true; zamanlayici = setTimeout(kaydet, 15000); } }
}

/* ---------- dokunma: seçili parçayı sürükle, boşta kaydır, iki parmakla yakınlaş ---------- */
const isaretler = new Map(); let surukle = null, kaydir = null, tutam = null, oynadi = false;
function dunya(ex, ey){ const u = (ex - gor.ox)/gor.s, v = (gor.oy - ey)/gor.s, co = Math.cos(gor.rot), si = Math.sin(gor.rot); return [u*co + v*si, -u*si + v*co]; }
function yer(e){ const r = tuval.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function vurulan(w){
  const pay = Math.max(0, 14/gor.s - 2);      // küçük parçalar için parmak payı
  for(let i = durum.parcalar.length - 1; i >= 0; i--) if(icinde(w, koseler(durum.parcalar[i], pay))) return durum.parcalar[i];
  return null;
}
tuval.addEventListener("pointerdown", e => {
  dokunuldu = true;
  tuval.setPointerCapture(e.pointerId); const p = yer(e); isaretler.set(e.pointerId, p); oynadi = false;
  if(isaretler.size === 2){
    const [a, b] = [...isaretler.values()]; surukle = null; kaydir = null;
    tutam = {d: Math.hypot(a[0]-b[0], a[1]-b[1]), s: gor.s, rot: gor.rot, a: Math.atan2(b[1]-a[1], b[0]-a[0]), w: dunya((a[0]+b[0])/2, (a[1]+b[1])/2)};
  }else if(isaretler.size === 1){
    const w = dunya(p[0], p[1]), v = vurulan(w), s = seciliParca();
    if(s && v && v.id === s.id) surukle = {dx: s.x - w[0], dy: s.y - w[1]};
    else kaydir = {x: p[0], y: p[1], ox: gor.ox, oy: gor.oy};
  }
});
tuval.addEventListener("pointermove", e => {
  if(!isaretler.has(e.pointerId)) return;
  const p = yer(e), eski = isaretler.get(e.pointerId); isaretler.set(e.pointerId, p);
  if(Math.hypot(p[0]-eski[0], p[1]-eski[1]) > 0.5) oynadi = oynadi || (kaydir ? Math.hypot(p[0]-kaydir.x, p[1]-kaydir.y) > 6 : true);
  if(tutam && isaretler.size === 2){
    const [a, b] = [...isaretler.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]), m = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    let da = Math.atan2(b[1]-a[1], b[0]-a[0]) - tutam.a; while(da > Math.PI) da -= 2*Math.PI; while(da < -Math.PI) da += 2*Math.PI;
    if(!tutam.doner && Math.abs(da) > 0.12) tutam.doner = true;      // küçük titremede harita dönmesin
    gor.s = Math.max(0.8, Math.min(40, tutam.s*d/tutam.d)); gor.rot = tutam.doner ? tutam.rot - da : tutam.rot;
    const co = Math.cos(gor.rot), si = Math.sin(gor.rot), wx = tutam.w[0], wy = tutam.w[1];     // parmakların ortasındaki nokta yerinde kalsın
    gor.ox = m[0] - (wx*co - wy*si)*gor.s; gor.oy = m[1] + (wx*si + wy*co)*gor.s; ciz();
  }else if(surukle){
    const s = seciliParca(), w = dunya(p[0], p[1]); if(!s) return;
    s.x = +(w[0] + surukle.dx).toFixed(2); s.y = +(w[1] + surukle.dy).toFixed(2); surukle.oynadi = true; paneliYaz();
  }else if(kaydir){ gor.ox = kaydir.ox + p[0] - kaydir.x; gor.oy = kaydir.oy + p[1] - kaydir.y; ciz(); }
});
function birakIsaret(e){
  if(!isaretler.has(e.pointerId)) return;
  const p = isaretler.get(e.pointerId); isaretler.delete(e.pointerId);
  if(surukle && surukle.oynadi) degisti();
  else if(!tutam && !oynadi && e.type === "pointerup"){     // dokunuş: seç / seçimi bırak
    const v = vurulan(dunya(p[0], p[1])); secili = v ? v.id : null; paneliYaz();
  }
  if(isaretler.size < 2) tutam = null;
  if(isaretler.size === 0){ surukle = null; kaydir = null; }
}
tuval.addEventListener("pointerup", birakIsaret); tuval.addEventListener("pointercancel", birakIsaret);
tuval.addEventListener("wheel", e => {
  e.preventDefault(); const p = yer(e), w = dunya(p[0], p[1]), s = Math.max(0.8, Math.min(40, gor.s*Math.exp(-e.deltaY*0.0015)));
  const co = Math.cos(gor.rot), si = Math.sin(gor.rot);
  gor.s = s; gor.ox = p[0] - (w[0]*co - w[1]*si)*s; gor.oy = p[1] + (w[0]*si + w[1]*co)*s; ciz();
}, {passive:false});

/* ---------- konum (yalnız web adresindeki sürümde) ---------- */
let konum = null, izliyor = false;
function enlemdenYerel(lat, lon){      // WGS84 -> 3° TM (orta meridyen GEO.lon0) -> yerel çerçeve
  const a = 6378137, f = 1/298.257222101, e2 = f*(2-f), ep2 = e2/(1-e2), fi = lat*Math.PI/180, la = (lon - GEO.lon0)*Math.PI/180;
  const N = a/Math.sqrt(1 - e2*Math.sin(fi)**2), T = Math.tan(fi)**2, C = ep2*Math.cos(fi)**2, A = la*Math.cos(fi);
  const M = a*((1 - e2/4 - 3*e2*e2/64 - 5*e2**3/256)*fi - (3*e2/8 + 3*e2*e2/32 + 45*e2**3/1024)*Math.sin(2*fi)
            + (15*e2*e2/256 + 45*e2**3/1024)*Math.sin(4*fi) - (35*e2**3/3072)*Math.sin(6*fi));
  const X = 500000 + N*(A + (1 - T + C)*A**3/6 + (5 - 18*T + T*T + 72*C - 58*ep2)*A**5/120);
  const Y = M + N*Math.tan(fi)*(A*A/2 + (5 - T + 9*C + 4*C*C)*A**4/24 + (61 - 58*T + T*T + 600*C - 330*ep2)*A**6/720);
  const dx = X - GEO.c0[0], dy = Y - GEO.c0[1];
  return [GEO.R[0][0]*dx + GEO.R[0][1]*dy, GEO.R[1][0]*dx + GEO.R[1][1]*dy];
}
function konumaGit(){ if(!konum) return; const r = tuval.getBoundingClientRect(), e = E(konum.x, konum.y); gor.ox += r.width/2 - e[0]; gor.oy += r.height*0.45 - e[1]; ciz(); }
function konumBaslat(){
  const d = el("konumDugme");
  if(izliyor){ konumaGit(); return; }
  izliyor = true; d.textContent = "Konum aranıyor…";
  navigator.geolocation.watchPosition(p => {
    const w = enlemdenYerel(p.coords.latitude, p.coords.longitude), ilk = !konum;
    konum = {x: w[0], y: w[1], d: p.coords.accuracy || 5};
    const uzak = !icinde(w, SAHA.sinir) && Math.min(...SAHA.sinir.map(q => Math.hypot(q[0]-w[0], q[1]-w[1]))) > 150;
    d.textContent = uzak ? "Arazinin dışındasın" : "Konumum ±" + Math.round(konum.d) + " m";
    el("buraya").hidden = !seciliParca(); if(ilk && !uzak) konumaGit(); else ciz();
  }, e => { izliyor = e.code !== 1 && izliyor; d.textContent = e.code === 1 ? "Konum izni verilmedi" : "Konum alınamadı, yeniden dene"; if(e.code !== 1) izliyor = false; },
  {enableHighAccuracy: true, maximumAge: 2000, timeout: 20000});
}
if(GEO && navigator.geolocation){ el("konumDugme").hidden = false; el("konumDugme").onclick = konumBaslat; }
el("buraya").onclick = () => { const p = seciliParca(); if(!p || !konum) return; p.x = +konum.x.toFixed(2); p.y = +konum.y.toFixed(2); degisti(); paneliYaz(); };

/* ---------- düğmeler ---------- */
el("ekle").addEventListener("click", e => {
  const b = e.target.closest("button[data-tip]"); if(!b) return;
  const r = tuval.getBoundingClientRect(), w = dunya(r.width/2, r.height*0.4), s = seciliParca();
  ekle(b.dataset.tip, w[0], w[1], s ? s.aci : 0);
});
function dondur(d){ const p = seciliParca(); if(!p) return; p.aci = +(((p.aci + d) % 360 + 360) % 360).toFixed(1); degisti(); paneliYaz(); }
el("donSol5").onclick = () => dondur(5); el("donSol1").onclick = () => dondur(1);
el("donSag1").onclick = () => dondur(-1); el("donSag5").onclick = () => dondur(-5);
el("sil").onclick = () => { durum.parcalar = durum.parcalar.filter(p => p.id !== secili); secili = null; degisti(); paneliYaz(); };
el("kopya").onclick = () => { const p = seciliParca(); if(p) ekle(p.tip, p.x + 6, p.y - 4, p.aci); };
el("birak").onclick = () => { secili = null; paneliYaz(); };

function kagitAc(html){ el("kagit").innerHTML = html; el("perde").hidden = false; }
function kagitKapat(){ el("perde").hidden = true; }
el("perde").addEventListener("click", e => { if(e.target === el("perde")) kagitKapat(); });
function menu(){

    '<button id="mD4">Hazır planı (D4) yükle</button>' +

    '<button id="mSig">Tüm araziyi göster</button>' +
    '<button id="mKuzey">Kuzeyi yukarı al</button>' +

    '<button id="mMetin">Yerleşimi metin olarak al</button>' +

    '<button id="mKapat" class="ana-dugme">Kapat</button>');
  el("mKapat").onclick = kagitKapat;
  el("mNo").onclick = () => { agacNo = !agacNo; kagitKapat(); ciz(); };
  el("mSig").onclick = () => { sigdir(); kagitKapat(); ciz(); };
  el("mKuzey").onclick = () => { gor.rot = Math.PI/2 - Math.atan2(SAHA.kuzey[1], SAHA.kuzey[0]); sigdir(); kagitKapat(); ciz(); };
  el("mManzara").onclick = () => { gor.rot = 0; sigdir(); kagitKapat(); ciz(); };
  el("mD4").onclick = () => onay("Hazır plan yüklensin mi?", "Haritadaki " + durum.parcalar.length + " parça silinir, yerine D4 planındaki evler, havuzlar ve ana bina gelir. Sonra istediğini oynatırsın.", "Yükle", () => {
    durum.parcalar = SAHA.d4.map(p => ({id: yeniId(), tip: p.tip, ad: p.ad, x: p.x, y: p.y, aci: p.aci}));
    durum.sayac = {ev: 13, havuz: 6, ana: 2, otopark: 1, resepsiyon: 1, aritma: 1}; secili = null; degisti(); paneliYaz();
  });
  el("mTemiz").onclick = () => onay("Hepsi silinsin mi?", "Haritadaki " + durum.parcalar.length + " parça silinir. Geri alınamaz.", "Sil", () => {

      catch(e){ el("metin").focus(); el("metin").select(); el("mKopya").textContent = "Metni seçtim, elle kopyala"; }
    };
  };
}
function onay(baslik, metin, evet, is){
  kagitAc("<h2>" + baslik + "</h2><p>" + metin + '</p><button id="oEvet" class="ana-dugme">' + evet + '</button><button id="oHayir">Vazgeç</button>');
  el("oEvet").onclick = () => { kagitKapat(); is(); }; el("oHayir").onclick = kagitKapat;
}
el("menuDugme").onclick = menu;

let dokunuldu = false;
function yenidenBoyutla(){ boyutla(); if(!dokunuldu) sigdir(); ciz(); }
new ResizeObserver(yenidenBoyutla).observe(el("harita"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ciz);

async function kilidiAc(anahtar){
  const b = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/")), ch => ch.charCodeAt(0));
  const k = await crypto.subtle.importKey("raw", b(anahtar), "AES-GCM", false, ["decrypt"]);
  const o = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b(KILIT.iv)}, k, b(KILIT.veri))));
  SAHA = o.saha; GEO = o.geo;
}
async function giris(aday){
  let a = String(aday || "").trim(); if(a.includes("#")) a = a.slice(a.indexOf("#") + 1);
  try{ if(!a) throw 0; await kilidiAc(a); }
  catch(e){ document.getElementById("kilit").hidden = false; document.getElementById("kilitNot").textContent = a ? "Bu anahtar açmadı." : ""; return; }
  try{ localStorage.setItem("sablon-anahtar", a); }catch(e){}
  document.getElementById("kilit").hidden = true; document.getElementById("uygulama").hidden = false;
  BASLAT();
}
document.getElementById("kilitAc").onclick = () => giris(document.getElementById("kilitGiris").value);
let kayitli = ""; try{ kayitli = localStorage.getItem("sablon-anahtar") || ""; }catch(e){}
giris(location.hash.slice(1) || kayitli);
window.addEventListener("hashchange", () => { if(!SAHA) giris(location.hash.slice(1)); });
</script>
